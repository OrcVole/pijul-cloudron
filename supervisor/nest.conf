; Three long-running processes. Every one of them runs as `cloudron`.
;
; HOME is set explicitly on each program. supervisord's `user=` drops the uid but
; does NOT reset HOME, so children inherit root's /root and anything reading $HOME
; dies EACCES as the unprivileged user (gotcha #147). Upstream's own unit sets
; HOME under the state directory for the API, so this matters twice over.

[program:nest-api]
directory=/app/data
command=/app/code/bin/api-start.sh
user=cloudron
environment=HOME="/app/data/home"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nest-ui]
directory=/app/data
command=/app/code/bin/ui-start.sh
user=cloudron
environment=HOME="/app/data/home"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; No -g "daemon off;" here: nginx.conf already sets `daemon off;` itself, and
; nginx rejects the directive as a duplicate when it is given both ways
; ("daemon" directive is duplicate in .../nginx.conf:15), which crash-looped
; nginx under supervisor and left the app answering nothing on :8000.
command=/usr/sbin/nginx -c /run/nest/nginx.conf
user=root
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; PageRank over the repository graph. Upstream runs it from a systemd timer at
; OnBootSec=5min then every 6h; this is the same shape as a supervisor program that
; sleeps rather than a cron entry, so its output lands in the app log like everything
; else and there is no second scheduler to reason about.
[program:nest-rank]
directory=/app/data
command=/app/code/bin/rank-loop.sh
user=cloudron
environment=HOME="/app/data/home",RUST_LOG="nest_rank=info"
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
