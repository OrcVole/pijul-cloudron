; Our own supervisord.conf rather than the base's.
;
; The stock one puts its pidfile at /var/run/supervisord.pid and its child logs at
; /var/log/supervisor. Only /app/data, /run and /tmp are writable at runtime, so
; everything supervisor writes is pointed at /run/nest instead. Nothing here relies
; on /var being writable.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/nest/supervisord.pid
childlogdir=/run/nest
user=root

[unix_http_server]
file=/run/nest/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/nest/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
