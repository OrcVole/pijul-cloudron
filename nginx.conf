# The container's front proxy. Cloudron's httpPort points HERE, at 8000, and not at
# either application process.
#
# This is not a stylistic choice. Upstream splits one public hostname across both
# processes by path, and the split is load bearing: the UI answers 404 for /login
# while the API answers 405 to a GET on it. Pointing httpPort straight at the UI
# renders a perfect front page and makes signing in impossible.
#
# Modelled on the vhost at the bottom of upstream's nest.nix, with one deliberate
# omission: upstream also aliases /_app/, /fonts/ and /theme-init.js to files on
# disk. adapter-node serves all of those itself, verified returning 200 with the
# right content types, so upstream's aliases are a gzip_static and immutable-caching
# optimisation rather than a requirement.

daemon off;
pid /run/nest/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Everything nginx writes goes under /run: /var is readonly at runtime.
    client_body_temp_path /run/nest/nginx/body;
    proxy_temp_path       /run/nest/nginx/proxy;
    fastcgi_temp_path     /run/nest/nginx/fastcgi;
    uwsgi_temp_path       /run/nest/nginx/uwsgi;
    scgi_temp_path        /run/nest/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;

    # Pushes carry whole changes. The API has its own partial_change_size limit;
    # nginx must not be the thing that rejects a large push first.
    client_max_body_size 512m;

    upstream nest-api {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    }
    upstream nest-ui {
        server 127.0.0.1:5050 max_fails=3 fail_timeout=10s;
    }

    # Cloudron terminates TLS at its own proxy, so the app speaks plain HTTP and
    # takes the original scheme from the forwarded header.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_conn_zone $binary_remote_addr zone=sysinfo_conn:1m;

    server {
        listen 8000;
        server_name _;

        location /api {
            proxy_pass http://nest-api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /login {
            proxy_pass http://nest-api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /register {
            proxy_pass http://nest-api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Clone and push over HTTPS. This is what makes the app usable without the
        # SSH port ever being opened.
        location ~ ^/[^/]+/[^/]+/\.pijul {
            proxy_pass http://nest-api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /srv/sysinfo {
            proxy_pass http://nest-ui;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            limit_conn sysinfo_conn 4;
            limit_conn_status 429;
        }

        location / {
            proxy_pass http://nest-ui;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
